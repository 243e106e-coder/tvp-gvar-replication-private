name: Run GDP Log-Level Dominant GPR + VIX

on:
  workflow_dispatch:
    inputs:
      gpr_column:
        description: "GPR specification"
        required: true
        type: choice
        default: "LN_GPR_QMEAN"
        options:
          - LN_GPR_QMEAN
          - LN_GPRT_QMEAN
          - LN_GPRA_QMEAN
          - LN_GPR_QMAX
      p:
        description: "Domestic lag order"
        required: true
        type: choice
        default: "2"
        options: ["1", "2"]
      saves:
        description: "Posterior saves"
        required: true
        default: "500"
      burns:
        description: "Burn-in draws"
        required: true
        default: "500"
      thin:
        description: "Fraction retained for IRF"
        required: true
        default: "0.5"
      horizon:
        description: "IRF horizon in quarters"
        required: true
        default: "12"
      shock_pct:
        description: "GPR impact increase in percent"
        required: true
        default: "10"
      gdp_dlog_scale:
        description: "1 if GDP_DLOG=Delta log GDP; 100 if GDP_DLOG=100*Delta log GDP"
        required: true
        default: "1"

jobs:
  estimate:
    name: GDP log-level | separate dominant [GPR,VIX]
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TVPGVAR_MACRO_XLSX: "8.12/TVP_GVAR_14经济体_5变量_2000Q1_2026Q2_处理完成.xlsx"
      TVPGVAR_WEIGHT_FILE: "8.12/Trade_Weights_14_Economies_2000_2014.csv"
      TVPGVAR_GPR_CSV: "8.12/gpr_quarterly_processed.csv"
      TVPGVAR_VIX_RAW_CSV: "8.12/VIXCLS_daily_fred.csv"
      TVPGVAR_VIX_PROCESSED_CSV: "data/vix_quarterly_processed.csv"
      TVPGVAR_BASE_INPUT: "data/model_input.csv"
      TVPGVAR_DOMINANT_INPUT: "data/model_input_dominant.csv"
      TVPGVAR_PROFILE: "GDP_LOGLEVEL_dominant_GPR_VIX"
      TVPGVAR_B1: "8"
      TVPGVAR_B2: "0.01"
      TVPGVAR_KAPPA0: "-0.005"
      TVPGVAR_SEED: "20260816"
      TVPGVAR_NEAR_UNIT_THRESHOLD: "0.98"
      TVPGVAR_G_CONDITION_WARN: "10000"
      TVPGVAR_GDP_BASE_INDEX: "100"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::remotes
            any::readxl
            any::snowfall
            any::zoo
            any::Matrix
            any::mvtnorm
            any::coda
            any::bayesm
            any::psych
            any::MCMCpack
            any::mnormt
            any::rARPACK
            any::ggplot2
            any::GIGrvg
            any::dlm
            any::Rcpp
            any::RcppArmadillo

      - name: Install compatible stochvol
        run: |
          Rscript -e 'remotes::install_version("stochvol", version="3.2.9", repos="https://cloud.r-project.org", upgrade="never")'

      - name: Patch and install threshtvp
        run: |
          sed -i 's|inv_f=solve(f.t(),Vtt.t(), "std").t();|inv_f=solve(arma::mat(f.t()),arma::mat(Vtt.t()), "std").t();|' threshtvp_source/src/threshold_functions.cpp
          R CMD INSTALL threshtvp_source

      - name: Activate dominant-unit code
        run: |
          set -euo pipefail
          cp "8.12/prepare_data_structural_dominant_gpr_vix.R" "R/prepare_data_structural_dominant_gpr_vix.R"
          cp "8.12/dominant_gpr_vix_irf.R" "R/dominant_gpr_vix_irf.R"
          test -f "8.12/02b_build_14e_input_gdp_loglevel.R"
          test -f "8.12/02_build_14e_input_structural.R"
          test -f "8.12/03_add_vix_to_structural_input.R"
          test -f "8.12/04_build_dominant_unit_input.R"
          test -f "8.12/patch_BVAR_dominant_unit.R"
          test -f "8.12/run_dominant_gpr_vix_tvp_gvar.R"

      - name: Create dominant-unit compatible BVAR estimator
        run: |
          set -euo pipefail
          Rscript --vanilla "8.12/patch_BVAR_dominant_unit.R"
          test -f "R/BVAR_ttvp_dominant.r"

      - name: Build GDP log-level + GPR + VIX input
        env:
          TVPGVAR_GPR_COLUMN: ${{ inputs.gpr_column }}
          TVPGVAR_GDP_DLOG_SCALE: ${{ inputs.gdp_dlog_scale }}
        run: |
          set -euo pipefail
          Rscript --vanilla "8.12/02b_build_14e_input_gdp_loglevel.R"
          Rscript --vanilla "8.12/03_add_vix_to_structural_input.R"
          Rscript --vanilla "8.12/04_build_dominant_unit_input.R"
          cat results/gdp_loglevel_reconstruction_audit.csv

      - name: Parse model code before MCMC
        run: |
          set -euo pipefail
          Rscript --vanilla -e '
            parse(file="8.12/02b_build_14e_input_gdp_loglevel.R")
            parse(file="8.12/dominant_gpr_vix_irf.R")
            parse(file="8.12/run_dominant_gpr_vix_tvp_gvar.R")
            parse(file="R/BVAR_ttvp_dominant.r")
            cat("Parse checks passed.\n")
          '

      - name: Run GDP log-level dominant-unit TVP-GVAR
        env:
          TVPGVAR_P: ${{ inputs.p }}
          TVPGVAR_SAVES: ${{ inputs.saves }}
          TVPGVAR_BURNS: ${{ inputs.burns }}
          TVPGVAR_THIN: ${{ inputs.thin }}
          TVPGVAR_HORIZON: ${{ inputs.horizon }}
          TVPGVAR_GPR_SHOCK_PCT: ${{ inputs.shock_pct }}
        run: |
          set -euo pipefail
          Rscript --vanilla "8.12/run_dominant_gpr_vix_tvp_gvar.R"

          # IMPORTANT: *_y is now a GDP log LEVEL. The old cumulative-GDP files
          # were designed for GDP growth and must not be interpreted here.
          rm -f results/gpr_structural_cumulative_gdp.csv
          rm -f results/gpr_structural_cumulative_gdp_stable_only.csv

          cat >> results/dominant_model_architecture_summary.txt <<'EOF'
          GDP transformation in this run: LOG LEVEL (indexed; first sample = 100)
          Do NOT cumulatively sum the GDP IRF: the IRF itself is the log-level effect.
          EOF

      - name: Show key diagnostics
        if: always()
        run: |
          for f in \
            results/build_structural_input_summary.txt \
            results/gdp_loglevel_reconstruction_audit.csv \
            results/stability_summary_selected_dates.csv \
            results/local_stability_summary_by_country.csv \
            results/gdp_sign_diagnostic_stable_only.csv \
            results/gpr_shock_validation.csv; do
              if [ -f "$f" ]; then
                echo "===== $f ====="
                cat "$f"
              fi
          done

      - name: Upload GDP log-level artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdp-loglevel-dominant-${{ inputs.gpr_column }}-${{ github.run_id }}
          path: |
            results/
            data/model_input_before_gdp_loglevel.csv
            data/model_input_dominant.csv
            data/vix_quarterly_processed.csv
          if-no-files-found: warn
          retention-days: 30
