name: Log-Level vs Difference Forecast Specification Benchmarks
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
      - name: Run common-target expanding-window comparisons
        run: Rscript --vanilla 8.12/compare_loglevel_difference_forecasts.R
      - name: Upload diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level-difference-forecast-comparison-${{ github.run_id }}
          path: results/loglevels_model_comparison/
          if-no-files-found: warn
          retention-days: 30
