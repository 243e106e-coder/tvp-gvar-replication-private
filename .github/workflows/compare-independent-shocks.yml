name: Compare Independent GPR VIX EPU Oil TVP-GVAR

on:
  workflow_dispatch:
    inputs:
      p:
        description: Domestic lag (same for all 4 models)
        type: choice
        options: ["1", "2"]
        default: "1"
      saves:
        default: "500"
      burns:
        default: "500"
      shock_pct:
        description: Positive log-level shock percent (each index separately)
        default: "10"

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        risk: [GPR, VIX, EPU, OIL]
    env:
      RISK: ${{ matrix.risk }}
      TVPGVAR_P: ${{ inputs.p }}
      TVPGVAR_SAVES: ${{ inputs.saves }}
      TVPGVAR_BURNS: ${{ inputs.burns }}
      TVPGVAR_THIN: "0.5"
      TVPGVAR_HORIZON: "12"
      TVPGVAR_SHOCK_PCT: ${{ inputs.shock_pct }}
      TVPGVAR_SEED: "20260816"
      TVPGVAR_B1: "8"
      TVPGVAR_B2: "0.01"
      TVPGVAR_KAPPA0: "-0.005"
      TVPGVAR_CPU: "2"
      TVPGVAR_GDP_DLOG_SCALE: "100"
      TVPGVAR_GDP_BASE_INDEX: "100"
      TVPGVAR_MACRO_XLSX: "8.12/TVP_GVAR_14经济体_5变量_2000Q1_2026Q2_处理完成.xlsx"
      TVPGVAR_WEIGHT_FILE: "8.12/Trade_Weights_14_Economies_2000_2014.csv"
      TVPGVAR_GPR_CSV: "8.12/gpr_quarterly_processed.csv"
      TVPGVAR_VIX_RAW_CSV: "8.12/VIXCLS_daily_fred.csv"
      TVPGVAR_VIX_PROCESSED_CSV: "data/vix_quarterly_processed.csv"

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::remotes
            any::readxl
            any::snowfall
            any::zoo
            any::Matrix
            any::mvtnorm
            any::coda
            any::bayesm
            any::psych
            any::MCMCpack
            any::mnormt
            any::rARPACK
            any::ggplot2
            any::GIGrvg
            any::dlm
            any::Rcpp
            any::RcppArmadillo
      - name: Install original solver dependencies
        shell: bash
        run: |
          Rscript -e 'remotes::install_version("stochvol",version="3.2.9",repos="https://cloud.r-project.org",upgrade="never")'
          sed -i 's|inv_f=solve(f.t(),Vtt.t(), "std").t();|inv_f=solve(arma::mat(f.t()),arma::mat(Vtt.t()), "std").t();|' threshtvp_source/src/threshold_functions.cpp
          R CMD INSTALL threshtvp_source
      - name: Prepare compatible original engine and input
        shell: bash
        run: |
          mkdir -p R data results
          Rscript --vanilla 8.12/patch_BVAR_dominant_unit.R
          Rscript --vanilla 8.12/02b_build_14e_input_gdp_loglevel.R
          if [ "$RISK" = VIX ]; then
            Rscript --vanilla 8.12/03_add_vix_to_structural_input.R
          fi
          test -f "8.12/Global_EPU_Quarterly_1997Q1_2026Q3.csv"
          Rscript -e 'parse("8.12/compare_four_shocks.R")'
      - name: Estimate independent shock
        shell: bash
        run: Rscript --vanilla 8.12/compare_four_shocks.R
      - name: Upload diagnostics and IRFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-${{ matrix.risk }}-${{ github.run_id }}
          path: results/independent_shocks/
          retention-days: 30
          if-no-files-found: warn
