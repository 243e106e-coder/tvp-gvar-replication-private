name: Run P2 GVAR(2,1) Stability Grid

on:
  workflow_dispatch:
    inputs:
      saves:
        description: "Posterior saves per grid cell"
        required: true
        default: "500"
      burns:
        description: "Burn-in draws per grid cell"
        required: true
        default: "500"
      thin:
        description: "IRF retained fraction"
        required: true
        default: "0.5"
      horizon:
        description: "IRF horizon"
        required: true
        default: "12"
      shock_pct:
        description: "Global GPR shock percent"
        required: true
        default: "10"

jobs:
  estimate:
    name: Stability ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - profile: P2_baseline
            p: "2"
            b1: "3"
            b2: "0.03"
            kappa0: "-0.005"
          - profile: P2_medium
            p: "2"
            b1: "5"
            b2: "0.015"
            kappa0: "-0.005"
          - profile: P2_strong
            p: "2"
            b1: "8"
            b2: "0.01"
            kappa0: "-0.005"

    env:
      TVPGVAR_MACRO_XLSX: "8.12/TVP_GVAR_14经济体_5变量_2000Q1_2026Q2_处理完成.xlsx"
      TVPGVAR_WEIGHT_FILE: "8.12/Trade_Weights_14_Economies_2000_2014.csv"
      TVPGVAR_GPR_CSV: "8.12/gpr_quarterly_processed.csv"
      TVPGVAR_PROFILE: ${{ matrix.profile }}
      TVPGVAR_P: ${{ matrix.p }}
      TVPGVAR_B1: ${{ matrix.b1 }}
      TVPGVAR_B2: ${{ matrix.b2 }}
      TVPGVAR_KAPPA0: ${{ matrix.kappa0 }}
      TVPGVAR_SEED: "20260816"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install R
        timeout-minutes: 30
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install R packages
        timeout-minutes: 60
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::remotes
            any::readxl
            any::snowfall
            any::zoo
            any::Matrix
            any::mvtnorm
            any::coda
            any::bayesm
            any::psych
            any::MCMCpack
            any::mnormt
            any::rARPACK
            any::ggplot2
            any::GIGrvg
            any::dlm
            any::Rcpp
            any::RcppArmadillo

      - name: Install compatible stochvol
        run: Rscript -e 'remotes::install_version("stochvol", version="3.2.9", repos="https://cloud.r-project.org", upgrade="never")'

      - name: Patch and install threshtvp
        run: |
          sed -i 's|inv_f=solve(f.t(),Vtt.t(), "std").t();|inv_f=solve(arma::mat(f.t()),arma::mat(Vtt.t()), "std").t();|' threshtvp_source/src/threshold_functions.cpp
          R CMD INSTALL threshtvp_source

      - name: Activate structural helper code
        run: |
          cp "8.12/prepare_data_structural.R" "R/prepare_data_structural.R"
          cp "8.12/gpr_structural_irf.R" "R/gpr_structural_irf.R"
          test -f "8.12/patch_BVAR_gpr_lag.R"
          test -f "8.12/run_gpr_tvp_gvar_structural.R"
          test -f "$TVPGVAR_GPR_CSV"
          test -f "$TVPGVAR_MACRO_XLSX"
          test -f "$TVPGVAR_WEIGHT_FILE"

      - name: Create GPR-lag-aware estimator
        run: |
          Rscript "8.12/patch_BVAR_gpr_lag.R"
          test -f "R/BVAR_ttvp_gprlag.r"

      - name: Verify builder syntax
        run: |
          Rscript --vanilla -e 'parse(file="8.12/02_build_14e_input_structural.R"); cat("Builder parse OK\n")'

      - name: Build 14-economy input
        env:
          TVPGVAR_GPR_COLUMN: "LN_GPR_QMEAN"
        run: Rscript --vanilla "8.12/02_build_14e_input_structural.R"

      - name: Verify GVAR(2,1) design
        run: |
          test "$TVPGVAR_P" = "2"
          echo "Domestic lag p=2"
          echo "Foreign weighted lag q=1"
          grep -n "tvpgvar_wex_lag(Wex, 1L" "R/BVAR_ttvp_gprlag.r" | head || true

      - name: Apply prior profile
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("8.12/run_gpr_tvp_gvar_structural.R")
          text = p.read_text(encoding="utf-8")
          pat = r"shrink\.parm\s*<-\s*list\(B_1\s*=\s*3,\s*B_2\s*=\s*0\.03,\s*kappa0\s*=\s*-0\.1/20\)"
          rep = (
              "shrink.parm <- list(B_1 = " + os.environ["TVPGVAR_B1"] +
              ", B_2 = " + os.environ["TVPGVAR_B2"] +
              ", kappa0 = " + os.environ["TVPGVAR_KAPPA0"] + ")"
          )
          new, n = re.subn(pat, rep, text, count=1)
          if n != 1:
              raise SystemExit(f"Expected one shrink.parm baseline line, found {n}")
          p.write_text(new, encoding="utf-8")
          print(os.environ["TVPGVAR_PROFILE"], rep)
          PY

      - name: Run P2 structural TVP-GVAR
        env:
          TVPGVAR_SAVES: ${{ inputs.saves }}
          TVPGVAR_BURNS: ${{ inputs.burns }}
          TVPGVAR_THIN: ${{ inputs.thin }}
          TVPGVAR_HORIZON: ${{ inputs.horizon }}
          TVPGVAR_GPR_SHOCK_PCT: ${{ inputs.shock_pct }}
          TVPGVAR_GPR_LAG_MODE: "current_only"
        run: Rscript "8.12/run_gpr_tvp_gvar_structural.R"

      - name: Record P2 parameters
        if: always()
        run: |
          mkdir -p results
          printf "profile,p,q,B_1,B_2,kappa0\n%s,2,1,%s,%s,%s\n" \
            "$TVPGVAR_PROFILE" "$TVPGVAR_B1" "$TVPGVAR_B2" "$TVPGVAR_KAPPA0" \
            > results/stability_profile_parameters.csv

      - name: Show diagnostics
        if: always()
        run: |
          for f in \
            results/run_structural_summary.txt \
            results/p2_design_preflight.csv \
            results/local_stability_summary_by_country.csv \
            results/stability_summary_selected_dates.csv \
            results/us_local_coefficient_summary.csv
          do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              cat "$f"
            fi
          done

      - name: Upload P2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvp-gvar-p2-${{ matrix.profile }}
          path: |
            results/
            data/model_input.csv
            data/model_input_structural.csv
            data/trade_weights.csv
          if-no-files-found: warn
          retention-days: 30
