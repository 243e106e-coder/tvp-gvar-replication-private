name: Design matrix exact reconciliation

on:
  workflow_dispatch:
  push:
    paths:
      - "8.12/05_country_specific_lag_selection.R"
      - "8.12/06_cn_za_instability_diagnostic.R"
      - "8.12/08_design_matrix_reconciliation.R"
      - ".github/workflows/design_matrix_reconciliation.yml"

jobs:
  reconcile-design:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "8.12/05_country_specific_lag_selection.R"
            "8.12/06_cn_za_instability_diagnostic.R"
            "8.12/08_design_matrix_reconciliation.R"
          )
          for f in "${files[@]}"; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
            echo "FOUND: $f"
          done

      - name: Run direct design reconciliation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "8.12/design_matrix_reconciliation"
          Rscript --vanilla "8.12/08_design_matrix_reconciliation.R"

      - name: Show key results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          out="8.12/design_matrix_reconciliation"
          echo "=== SUMMARY ==="
          cat "$out/01_design_matrix_summary.csv"
          echo
          echo "=== UNMATCHED REGRESSORS ==="
          cat "$out/04_unmatched_regressors.csv" || true
          echo
          echo "=== STRUCTURAL SPECIFICATION DIFFERENCE ==="
          cat "$out/07_structural_specification_difference.csv"
          echo
          echo "=== README ==="
          cat "$out/README_design_matrix_reconciliation.txt"

      - name: Upload reconciliation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-matrix-reconciliation-${{ github.run_id }}
          path: 8.12/design_matrix_reconciliation/
          if-no-files-found: warn
          retention-days: 30
