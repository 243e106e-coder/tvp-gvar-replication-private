name: Run P2 Strong GPR US-Only + VIX

on:
  workflow_dispatch:
    inputs:
      saves:
        description: "Posterior saves"
        required: true
        default: "500"
      burns:
        description: "Burn-in draws"
        required: true
        default: "500"
      thin:
        description: "Fraction of saves retained for IRF calculations"
        required: true
        default: "0.5"
      horizon:
        description: "IRF horizon in quarters"
        required: true
        default: "12"
      shock_pct:
        description: "Impact increase in endogenous US GPR, percent"
        required: true
        default: "10"

jobs:
  estimate:
    name: P2-strong US-endogenous-GPR + global-VIX
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TVPGVAR_MACRO_XLSX: "8.12/TVP_GVAR_14经济体_5变量_2000Q1_2026Q2_处理完成.xlsx"
      TVPGVAR_WEIGHT_FILE: "8.12/Trade_Weights_14_Economies_2000_2014.csv"
      TVPGVAR_GPR_CSV: "8.12/gpr_quarterly_processed.csv"
      TVPGVAR_VIX_RAW_CSV: "8.12/VIXCLS_daily_fred.csv"
      TVPGVAR_VIX_PROCESSED_CSV: "data/vix_quarterly_processed.csv"

      TVPGVAR_PROFILE: "P2_strong_GPR_USonly_VIX"
      TVPGVAR_P: "2"
      TVPGVAR_B1: "8"
      TVPGVAR_B2: "0.01"
      TVPGVAR_KAPPA0: "-0.005"
      TVPGVAR_SEED: "20260816"

      # Compatibility only. The new W mapping contains no non-US GPR regressor.
      TVPGVAR_GPR_LAG_MODE: "current_only"
      TVPGVAR_NEAR_UNIT_THRESHOLD: "0.98"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::remotes
            any::readxl
            any::snowfall
            any::zoo
            any::Matrix
            any::mvtnorm
            any::coda
            any::bayesm
            any::psych
            any::MCMCpack
            any::mnormt
            any::rARPACK
            any::ggplot2
            any::GIGrvg
            any::dlm
            any::Rcpp
            any::RcppArmadillo

      - name: Install compatible stochvol
        run: |
          Rscript -e 'remotes::install_version(
            "stochvol",
            version = "3.2.9",
            repos = "https://cloud.r-project.org",
            upgrade = "never"
          )'

      - name: Patch and install threshtvp
        run: |
          sed -i 's|inv_f=solve(f.t(),Vtt.t(), "std").t();|inv_f=solve(arma::mat(f.t()),arma::mat(Vtt.t()), "std").t();|' threshtvp_source/src/threshold_functions.cpp
          grep -n "inv_f=solve" threshtvp_source/src/threshold_functions.cpp
          R CMD INSTALL threshtvp_source

      - name: Activate structural helper code
        run: |
          set -euo pipefail

          cp "8.12/prepare_data_structural.R" "R/prepare_data_structural.R"
          cp "8.12/gpr_structural_irf.R" "R/gpr_structural_irf.R"

          cp "8.12/prepare_data_structural_gpr_vix.R" "R/prepare_data_structural_gpr_vix.R"
          cp "8.12/gpr_vix_overrides.R" "R/gpr_vix_overrides.R"

          cp "8.12/prepare_data_structural_gpr_vix_usonly.R" "R/prepare_data_structural_gpr_vix_usonly.R"
          cp "8.12/gpr_vix_usonly_overrides.R" "R/gpr_vix_usonly_overrides.R"

          test -f "8.12/patch_BVAR_gpr_lag.R"
          test -f "8.12/run_gpr_tvp_gvar_structural.R"
          test -f "8.12/02_build_14e_input_structural.R"
          test -f "8.12/03_add_vix_to_structural_input.R"
          test -f "8.12/patch_run_gpr_vix.R"
          test -f "8.12/patch_run_gpr_vix_usonly.R"

          test -f "$TVPGVAR_GPR_CSV"
          test -f "$TVPGVAR_MACRO_XLSX"
          test -f "$TVPGVAR_WEIGHT_FILE"
          test -f "$TVPGVAR_VIX_RAW_CSV"

      - name: Create GPR-lag-aware BVAR estimator
        run: |
          Rscript "8.12/patch_BVAR_gpr_lag.R"
          test -f "R/BVAR_ttvp_gprlag.r"

          grep -n "tvpgvar_wex_lag" "R/BVAR_ttvp_gprlag.r" | head
          grep -n "tvpgvar_safe_inverse" "R/BVAR_ttvp_gprlag.r" | head

          if grep -nF "ginv(A0inv)" "R/BVAR_ttvp_gprlag.r"; then
            echo "Broken ginv(A0inv) fallback is still present"
            exit 1
          fi

      - name: Build structural input and add local VIX
        env:
          TVPGVAR_GPR_COLUMN: "LN_GPR_QMEAN"
        run: |
          set -euo pipefail

          Rscript --vanilla "8.12/02_build_14e_input_structural.R"
          Rscript --vanilla "8.12/03_add_vix_to_structural_input.R"

          echo "===== VIX input summary ====="
          cat results/vix_input_summary.txt

          python - <<'PY'
          import csv

          with open(
              "data/model_input.csv",
              newline="",
              encoding="utf-8"
          ) as f:
              cols = next(csv.reader(f))

          us = [c for c in cols if c.startswith("US_")]
          expected = [
              "US_gpr",
              "US_vix",
              "US_y",
              "US_dp",
              "US_r",
              "US_de",
              "US_deq",
          ]

          print("US columns:", us)

          if us != expected:
              raise SystemExit(
                  f"US order mismatch: {us}"
              )

          print("US GPR -> VIX recursive ordering check passed.")
          PY

      - name: Generate US-only-GPR P2 run script
        run: |
          set -euo pipefail

          Rscript --vanilla "8.12/patch_run_gpr_vix.R"
          test -f "8.12/run_gpr_vix_tvp_gvar_structural.R"

          Rscript --vanilla "8.12/patch_run_gpr_vix_usonly.R"
          test -f "8.12/run_gpr_vix_usonly_tvp_gvar_structural.R"

          Rscript --vanilla -e '
            parse(file = "8.12/prepare_data_structural_gpr_vix_usonly.R")
            parse(file = "8.12/gpr_vix_usonly_overrides.R")
            parse(file = "8.12/patch_run_gpr_vix_usonly.R")
            parse(file = "8.12/run_gpr_vix_usonly_tvp_gvar_structural.R")
            cat("US-only-GPR R parse checks passed.\n")
          '

          grep -n "Non-US direct current GPR: REMOVED" \
            "8.12/run_gpr_vix_usonly_tvp_gvar_structural.R"

          grep -n 'expected_wex <- ifelse(cN == "US", 5L, 6L)' \
            "8.12/run_gpr_vix_usonly_tvp_gvar_structural.R"

          if grep -n '"global_gpr", "global_vix"' \
            "8.12/run_gpr_vix_usonly_tvp_gvar_structural.R"; then
            echo "Old non-US current GPR label remains in generated run script."
            exit 1
          fi

      - name: Apply P2-strong prior
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path(
              "8.12/run_gpr_vix_usonly_tvp_gvar_structural.R"
          )
          text = p.read_text(encoding="utf-8")

          pattern = (
              r"shrink\.parm\s*<-\s*list\("
              r"B_1\s*=\s*3,\s*"
              r"B_2\s*=\s*0\.03,\s*"
              r"kappa0\s*=\s*-0\.1/20"
              r"\)"
          )

          replacement = (
              "shrink.parm <- list("
              f"B_1 = {os.environ['TVPGVAR_B1']}, "
              f"B_2 = {os.environ['TVPGVAR_B2']}, "
              f"kappa0 = {os.environ['TVPGVAR_KAPPA0']}"
              ")"
          )

          patched, n = re.subn(
              pattern,
              replacement,
              text,
              count=1
          )

          if n != 1:
              raise SystemExit(
                  f"Expected one shrink.parm baseline line, found {n}"
              )

          p.write_text(
              patched,
              encoding="utf-8"
          )

          print(replacement)
          PY

          grep -n "shrink.parm" \
            "8.12/run_gpr_vix_usonly_tvp_gvar_structural.R" | head

      - name: Run P2 strong US-only GPR + VIX
        env:
          TVPGVAR_SAVES: ${{ inputs.saves }}
          TVPGVAR_BURNS: ${{ inputs.burns }}
          TVPGVAR_THIN: ${{ inputs.thin }}
          TVPGVAR_HORIZON: ${{ inputs.horizon }}
          TVPGVAR_GPR_SHOCK_PCT: ${{ inputs.shock_pct }}
        run: |
          Rscript --vanilla \
            "8.12/run_gpr_vix_usonly_tvp_gvar_structural.R"

      - name: Record experiment specification
        if: always()
        env:
          RUN_SAVES: ${{ inputs.saves }}
          RUN_BURNS: ${{ inputs.burns }}
          RUN_THIN: ${{ inputs.thin }}
          RUN_HORIZON: ${{ inputs.horizon }}
          RUN_SHOCK: ${{ inputs.shock_pct }}
        run: |
          mkdir -p results

          python - <<'PY'
          import csv
          import os

          row = {
              "profile": os.environ["TVPGVAR_PROFILE"],
              "p": os.environ["TVPGVAR_P"],
              "q": "1",
              "B_1": os.environ["TVPGVAR_B1"],
              "B_2": os.environ["TVPGVAR_B2"],
              "kappa0": os.environ["TVPGVAR_KAPPA0"],
              "seed": os.environ["TVPGVAR_SEED"],
              "saves": os.environ.get("RUN_SAVES", ""),
              "burns": os.environ.get("RUN_BURNS", ""),
              "thin": os.environ.get("RUN_THIN", ""),
              "horizon": os.environ.get("RUN_HORIZON", ""),
              "gpr_shock_pct": os.environ.get("RUN_SHOCK", ""),
              "gpr_role_US": "endogenous domestic variable",
              "nonUS_current_global_gpr": "REMOVED",
              "nonUS_lagged_global_gpr": "REMOVED",
              "nonUS_current_global_vix": "RETAINED",
              "nonUS_lagged_global_vix_q1": "RETAINED",
              "ordering": "GPR -> VIX -> y -> dp -> r -> de -> deq",
              "gpr_transform": "LN_GPR_QMEAN",
              "vix_series": "VIXCLS",
              "vix_transform": "log(quarterly mean of available positive daily closes)",
              "trade_weights": os.environ["TVPGVAR_WEIGHT_FILE"],
          }

          with open(
              "results/gpr_vix_usonly_run_parameters.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as f:
              w = csv.DictWriter(
                  f,
                  fieldnames=list(row.keys())
              )
              w.writeheader()
              w.writerow(row)
          PY

      - name: Show key diagnostics
        if: always()
        run: |
          echo "===== Parameters ====="
          if [ -f results/gpr_vix_usonly_run_parameters.csv ]; then
            cat results/gpr_vix_usonly_run_parameters.csv
          fi

          echo "===== GPR US-only mapping audit ====="
          if [ -f results/gpr_usonly_mapping_audit.csv ]; then
            cat results/gpr_usonly_mapping_audit.csv
          fi

          echo "===== P2 design preflight ====="
          if [ -f results/p2_design_preflight.csv ]; then
            cat results/p2_design_preflight.csv
          fi

          echo "===== Selected-date stability ====="
          if [ -f results/stability_summary_selected_dates.csv ]; then
            cat results/stability_summary_selected_dates.csv
          fi

          echo "===== Local stability ====="
          if [ -f results/local_stability_summary_by_country.csv ]; then
            cat results/local_stability_summary_by_country.csv
          fi

          echo "===== GDP sign diagnostic stable-only ====="
          if [ -f results/gdp_sign_diagnostic_stable_only.csv ]; then
            cat results/gdp_sign_diagnostic_stable_only.csv
          fi

          echo "===== VIX input summary ====="
          if [ -f results/vix_input_summary.txt ]; then
            cat results/vix_input_summary.txt
          fi

      - name: Upload US-only-GPR diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-strong-gpr-usonly-vix-${{ github.run_id }}
          path: |
            results/
            data/model_input.csv
            data/model_input_structural.csv
            data/trade_weights.csv
            data/vix_quarterly_processed.csv
            8.12/VIXCLS_daily_fred.csv
            8.12/run_gpr_vix_usonly_tvp_gvar_structural.R
          if-no-files-found: warn
          retention-days: 30
