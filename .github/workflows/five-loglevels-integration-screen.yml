name: Five Log-Levels Integration Order and Conditional Cointegration
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::urca
      - name: Build five variable log-level candidate input
        run: Rscript --vanilla 8.12/build_five_loglevels_input.R
      - name: Screen integration order and conditional cointegration
        run: Rscript --vanilla 8.12/screen_integration_and_cointegration.R
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-and-cointegration-${{ github.run_id }}
          path: results/loglevels_integration_screen/
          if-no-files-found: warn
          retention-days: 30
