name: Five Log-Levels Preflight and Experimental TVP-GVAR
'on':
  workflow_dispatch:
    inputs:
      run_experimental_estimation:
        description: 'CAUTION: estimate ordinary stationary TVP-GVAR on potentially I(1) levels; diagnostic only'
        required: true
        type: boolean
        default: false
      p:
        description: 'Domestic lag (exploratory)'
        type: choice
        options: ['1','2']
        default: '1'
      saves:
        default: '500'
      burns:
        default: '500'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::urca
      - name: Build isolated log-level data
        run: Rscript --vanilla 8.12/build_five_loglevels_input.R
      - name: Preflight unit root and cointegration screens
        run: Rscript --vanilla 8.12/preflight_five_loglevels.R
      - uses: actions/upload-artifact@v4
        with:
          name: five-loglevels-preflight-${{ github.run_id }}
          path: |
            data/loglevels/
            results/loglevels_preflight/
  experimental_estimate:
    needs: preflight
    if: ${{ inputs.run_experimental_estimation == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        risk: [GPR, VIX, EPU, OIL]
    env:
      RISK: ${{ matrix.risk }}
      TVPGVAR_MACRO_INPUT: data/loglevels/model_input.csv
      TVPGVAR_WEIGHT_FILE: 8.12/Trade_Weights_14_Economies_2000_2014.csv
      TVPGVAR_P: ${{ inputs.p }}
      TVPGVAR_SAVES: ${{ inputs.saves }}
      TVPGVAR_BURNS: ${{ inputs.burns }}
      TVPGVAR_THIN: '0.5'
      TVPGVAR_CPU: '2'
      TVPGVAR_HORIZON: '12'
      TVPGVAR_SHOCK_PCT: '10'
      TVPGVAR_SEED: '20260816'
      TVPGVAR_B1: '8'
      TVPGVAR_B2: '0.01'
      TVPGVAR_KAPPA0: '-0.005'
      COMPARE_OUTPUT_ROOT: results/five_loglevels_experimental
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::remotes
            any::readxl
            any::snowfall
            any::zoo
            any::Matrix
            any::mvtnorm
            any::coda
            any::bayesm
            any::psych
            any::MCMCpack
            any::mnormt
            any::rARPACK
            any::ggplot2
            any::GIGrvg
            any::dlm
            any::Rcpp
            any::RcppArmadillo
      - name: Install solver as in successful independent-shock workflow
        shell: bash
        run: |
          Rscript -e 'remotes::install_version("stochvol",version="3.2.9",repos="https://cloud.r-project.org",upgrade="never")'
          sed -i 's|inv_f=solve(f.t(),Vtt.t(), "std").t();|inv_f=solve(arma::mat(f.t()),arma::mat(Vtt.t()), "std").t();|' threshtvp_source/src/threshold_functions.cpp
          R CMD INSTALL threshtvp_source
      - name: Build candidate level dataset and separate VIX source
        run: |
          Rscript --vanilla 8.12/patch_BVAR_dominant_unit.R
          Rscript --vanilla 8.12/build_five_loglevels_input.R
          Rscript --vanilla 8.12/build_loglevels_vix.R
      - name: Estimate experimental levels using legacy solver (NOT a cointegrated model)
        env:
          TVPGVAR_VIX_PROCESSED_CSV: data/loglevels/vix_quarterly_processed.csv
        run: |
          if [ "$RISK" = VIX ]; then cp data/loglevels/vix_quarterly_processed.csv data/vix_quarterly_processed.csv; fi
          Rscript --vanilla 8.12/compare_four_shocks.R
      - name: Upload isolated experimental results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-loglevels-experimental-${{ matrix.risk }}-${{ github.run_id }}
          path: results/five_loglevels_experimental/
          retention-days: 30
          if-no-files-found: warn
