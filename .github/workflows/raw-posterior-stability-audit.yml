name: Raw TVP-GVAR Posterior Stability Audit
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shock: [GPR, VIX, EPU, OIL]
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MAX_DIAGNOSTIC_DRAWS: '40'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
      - name: Retrieve original posterior
        run: python3 8.12/fetch_historical_posterior.py --shock "${{ matrix.shock }}" --out results/raw_posterior_input
      - name: Reconstruct posterior system
        run: Rscript --vanilla 8.12/diagnose_raw_posterior_stability.R results/raw_posterior_input/posterior.rda "${{ matrix.shock }}" results/raw_posterior_audit
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-audit-${{ matrix.shock }}-${{ github.run_id }}
          path: |
            results/raw_posterior_audit/
            results/raw_posterior_input/posterior_source.json
          if-no-files-found: warn
