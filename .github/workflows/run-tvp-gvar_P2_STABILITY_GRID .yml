name: Run P2 Local Stability Repair Grid V2

on:
  workflow_dispatch:
    inputs:
      saves:
        description: "Posterior saves per grid cell"
        required: true
        default: "500"
      burns:
        description: "Burn-in draws per grid cell"
        required: true
        default: "500"
      thin:
        description: "Fraction of saves retained for IRF calculations"
        required: true
        default: "0.5"
      horizon:
        description: "IRF horizon in quarters"
        required: true
        default: "12"
      shock_pct:
        description: "Impact increase in global GPR, percent"
        required: true
        default: "10"
      gpr_column:
        description: "GPR transform"
        required: true
        default: "LN_GPR_QMEAN"
        type: choice
        options:
          - LN_GPR_QMEAN
          - LN_GPR_QMAX
          - LN_GPRT_QMEAN
          - LN_GPRA_QMEAN
      gpr_lag_mode:
        description: "Non-US direct GPR lag specification"
        required: true
        default: "current_only"
        type: choice
        options:
          - current_only
          - current_and_lag

jobs:
  estimate:
    name: Stability ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Two concurrent cells reduce setup-action/package throttling while still
      # running the three-cell P2 grid efficiently.
      max-parallel: 2
      matrix:
        include:
          - profile: P2_baseline
            p: "2"
            b1: "3"
            b2: "0.03"
            kappa0: "-0.005"
          - profile: P2_medium
            p: "2"
            b1: "5"
            b2: "0.015"
            kappa0: "-0.005"
          - profile: P2_strong
            p: "2"
            b1: "8"
            b2: "0.01"
            kappa0: "-0.005"

    env:
      TVPGVAR_MACRO_XLSX: "8.12/TVP_GVAR_14经济体_5变量_2000Q1_2026Q2_处理完成.xlsx"
      TVPGVAR_WEIGHT_FILE: "8.12/Trade_Weights_14_Economies_2000_2014.csv"
      TVPGVAR_GPR_CSV: "8.12/gpr_quarterly_processed.csv"
      TVPGVAR_PROFILE: ${{ matrix.profile }}
      TVPGVAR_P: ${{ matrix.p }}
      TVPGVAR_B1: ${{ matrix.b1 }}
      TVPGVAR_B2: ${{ matrix.b2 }}
      TVPGVAR_KAPPA0: ${{ matrix.kappa0 }}
      TVPGVAR_SEED: "20260816"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::remotes
            any::readxl
            any::snowfall
            any::zoo
            any::Matrix
            any::mvtnorm
            any::coda
            any::bayesm
            any::psych
            any::MCMCpack
            any::mnormt
            any::rARPACK
            any::ggplot2
            any::GIGrvg
            any::dlm
            any::Rcpp
            any::RcppArmadillo

      - name: Install compatible stochvol
        run: Rscript -e 'remotes::install_version("stochvol", version="3.2.9", repos="https://cloud.r-project.org", upgrade="never")'

      - name: Patch and install threshtvp
        run: |
          sed -i 's|inv_f=solve(f.t(),Vtt.t(), "std").t();|inv_f=solve(arma::mat(f.t()),arma::mat(Vtt.t()), "std").t();|' threshtvp_source/src/threshold_functions.cpp
          grep -n "inv_f=solve" threshtvp_source/src/threshold_functions.cpp
          R CMD INSTALL threshtvp_source

      - name: Activate structural helper code
        run: |
          cp "8.12/prepare_data_structural.R" "R/prepare_data_structural.R"
          cp "8.12/gpr_structural_irf.R" "R/gpr_structural_irf.R"
          test -f "8.12/patch_BVAR_gpr_lag.R"
          test -f "8.12/run_gpr_tvp_gvar_structural.R"
          test -f "$TVPGVAR_GPR_CSV"
          test -f "$TVPGVAR_MACRO_XLSX"
          test -f "$TVPGVAR_WEIGHT_FILE"

      - name: Create GPR-lag-aware BVAR estimator
        run: |
          Rscript "8.12/patch_BVAR_gpr_lag.R"
          test -f "R/BVAR_ttvp_gprlag.r"
          grep -n "tvpgvar_wex_lag" "R/BVAR_ttvp_gprlag.r" | head
          grep -n "tvpgvar_safe_inverse" "R/BVAR_ttvp_gprlag.r" | head
          if grep -nF "ginv(A0inv)" "R/BVAR_ttvp_gprlag.r"; then
            echo "Broken ginv(A0inv) fallback is still present"
            exit 1
          fi

      - name: Verify singular-matrix fallback
        run: |
          Rscript - <<'RS'
          source("R/BVAR_ttvp_gprlag.r")
          A <- matrix(c(1, 2, 2, 4), nrow = 2)
          Ainv <- tvpgvar_safe_inverse(A, "workflow preflight")
          stopifnot(is.matrix(Ainv), is.numeric(Ainv), all(is.finite(Ainv)))
          cat("Singular-matrix generalized-inverse fallback passed.\n")
          RS

      - name: Verify structural builder syntax
        run: |
          echo "===== checked-out commit ====="
          git rev-parse HEAD
          git status --short
          echo "===== builder SHA256 ====="
          sha256sum "8.12/02_build_14e_input_structural.R"
          echo "===== builder tail ====="
          nl -ba "8.12/02_build_14e_input_structural.R" | tail -n 90
          echo "===== R parse check ====="
          Rscript --vanilla -e 'parse(file="8.12/02_build_14e_input_structural.R"); cat("Builder parse OK\n")'

      - name: Build structural 14-economy input
        env:
          TVPGVAR_GPR_COLUMN: ${{ inputs.gpr_column }}
        run: Rscript --vanilla "8.12/02_build_14e_input_structural.R"

      - name: Show structural input diagnostics
        run: |
          cat results/build_structural_input_summary.txt
          echo "model_input columns:"
          head -n 1 data/model_input.csv
          echo "US block columns:"
          python - <<'PY'
          import csv
          with open('data/model_input.csv', newline='', encoding='utf-8') as f:
              cols = next(csv.reader(f))
          print([c for c in cols if c.startswith('US_')])
          PY

      - name: Apply stability-grid prior
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path("8.12/run_gpr_tvp_gvar_structural.R")
          text = p.read_text(encoding="utf-8")
          pattern = r"shrink\.parm\s*<-\s*list\(B_1\s*=\s*3,\s*B_2\s*=\s*0\.03,\s*kappa0\s*=\s*-0\.1/20\)"
          replacement = (
              "shrink.parm <- list(B_1 = " + os.environ["TVPGVAR_B1"] +
              ", B_2 = " + os.environ["TVPGVAR_B2"] +
              ", kappa0 = " + os.environ["TVPGVAR_KAPPA0"] + ")"
          )
          patched, n = re.subn(pattern, replacement, text, count=1)
          if n != 1:
              raise SystemExit(f"Expected exactly one shrink.parm baseline line, found {n}")
          p.write_text(patched, encoding="utf-8")
          print(os.environ["TVPGVAR_PROFILE"], replacement)
          PY
          grep -n "shrink.parm" "8.12/run_gpr_tvp_gvar_structural.R" | head

      - name: Run structural TVP-GVAR stability cell
        env:
          TVPGVAR_SAVES: ${{ inputs.saves }}
          TVPGVAR_BURNS: ${{ inputs.burns }}
          TVPGVAR_THIN: ${{ inputs.thin }}
          TVPGVAR_HORIZON: ${{ inputs.horizon }}
          TVPGVAR_GPR_SHOCK_PCT: ${{ inputs.shock_pct }}
          TVPGVAR_GPR_LAG_MODE: ${{ inputs.gpr_lag_mode }}
        run: Rscript "8.12/run_gpr_tvp_gvar_structural.R"

      - name: Record grid-cell parameters
        if: always()
        env:
          GRID_SAVES: ${{ inputs.saves }}
          GRID_BURNS: ${{ inputs.burns }}
          GRID_THIN: ${{ inputs.thin }}
          GRID_GPR_LAG_MODE: ${{ inputs.gpr_lag_mode }}
        run: |
          mkdir -p results
          python - <<'PY'
          import csv
          import os
          with open("results/stability_profile_parameters.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=[
                  "profile", "p", "q", "seed", "B_1", "B_2", "kappa0",
                  "saves", "burns", "thin", "gpr_lag_mode"
              ])
              w.writeheader()
              w.writerow({
                  "profile": os.environ["TVPGVAR_PROFILE"],
                  "p": os.environ["TVPGVAR_P"],
                  "q": "1",
                  "seed": os.environ["TVPGVAR_SEED"],
                  "B_1": os.environ["TVPGVAR_B1"],
                  "B_2": os.environ["TVPGVAR_B2"],
                  "kappa0": os.environ["TVPGVAR_KAPPA0"],
                  "saves": os.environ.get("GRID_SAVES", ""),
                  "burns": os.environ.get("GRID_BURNS", ""),
                  "thin": os.environ.get("GRID_THIN", ""),
                  "gpr_lag_mode": os.environ.get("GRID_GPR_LAG_MODE", "")
              })
          PY

      - name: Show stability diagnostics
        if: always()
        run: |
          echo "Profile: $TVPGVAR_PROFILE  p=$TVPGVAR_P  q=1  B_1=$TVPGVAR_B1  B_2=$TVPGVAR_B2  kappa0=$TVPGVAR_KAPPA0"
          if [ -f results/run_structural_summary.txt ]; then
            cat results/run_structural_summary.txt
          fi
          if [ -f results/p2_design_preflight.csv ]; then
            echo "P2 design preflight:"
            cat results/p2_design_preflight.csv
          fi
          if [ -f results/local_stability_summary_by_country.csv ]; then
            echo "Local stability:"
            cat results/local_stability_summary_by_country.csv
          fi
          if [ -f results/stability_summary_selected_dates.csv ]; then
            echo "Selected-date stability:"
            cat results/stability_summary_selected_dates.csv
          fi
          if [ -f results/us_local_coefficient_summary.csv ]; then
            echo "US coefficient-level diagnosis:"
            cat results/us_local_coefficient_summary.csv
          fi

      - name: Upload stability cell
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvp-gvar-stability-v2-${{ matrix.profile }}
          path: |
            results/
            data/model_input.csv
            data/model_input_structural.csv
            data/trade_weights.csv
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Aggregate stability grid
    needs: estimate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download grid-cell artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tvp-gvar-stability-v2-*
          path: grid-artifacts

      - name: Build stability comparison tables
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          root = Path("grid-artifacts")
          param_files = sorted(root.glob("*/results/stability_profile_parameters.csv"))
          if not param_files:
              raise SystemExit("No completed stability-grid artifacts were found.")

          def read_csv(path):
              with path.open(newline="", encoding="utf-8-sig") as f:
                  return list(csv.DictReader(f))

          def as_float(x):
              try:
                  return float(x)
              except (TypeError, ValueError):
                  return float("nan")

          def truthy(x):
              return str(x).strip().upper() in {"TRUE", "T", "1", "YES"}

          comparison = []
          selected_all = []

          for pf in param_files:
              res = pf.parent
              params = read_csv(pf)[0]
              profile = params["profile"]

              required = [
                  res / "stability_summary_by_date.csv",
                  res / "local_stability_summary_by_country.csv",
                  res / "residual_serial_correlation_diagnostic.csv"
              ]
              if not all(p.exists() for p in required):
                  print(f"Skipping incomplete profile {profile}")
                  continue

              stab = read_csv(required[0])
              stable_draws = sum(as_float(r["stable_draws"]) for r in stab)
              draws = sum(as_float(r["draws"]) for r in stab)
              global_stable = stable_draws / draws if draws else float("nan")
              date_shares = [as_float(r["stable_share"]) for r in stab]

              local_rows = read_csv(required[1])
              local = {r["country"]: as_float(r["stable_share"]) for r in local_rows}
              worst = min(local_rows, key=lambda r: as_float(r["stable_share"]))

              serial = read_csv(required[2])
              r_tests = [r for r in serial if r.get("variable", "").endswith("_r")]
              r_reject = (
                  sum(truthy(r.get("reject_5pct")) for r in r_tests) / len(r_tests)
                  if r_tests else float("nan")
              )

              source_file = res / "stability_source_summary.csv"
              dominant_source = ""
              dominant_source_share = float("nan")
              if source_file.exists():
                  src = read_csv(source_file)
                  if src:
                      top = max(src, key=lambda r: as_float(r["share"]))
                      dominant_source = top.get("likely_source", "")
                      dominant_source_share = as_float(top.get("share"))

              us_coef_file = res / "us_local_coefficient_summary.csv"
              us_r_ar_sum = float("nan")
              us_r_row_fix_share = float("nan")
              if us_coef_file.exists():
                  us_coef = read_csv(us_coef_file)
                  if us_coef:
                      us_r_ar_sum = as_float(us_coef[0].get("median_US_r_ar_sum"))
                      us_r_row_fix_share = as_float(
                          us_coef[0].get("unstable_share_fixed_by_US_r_row")
                      )

              comparison.append({
                  "profile": profile,
                  "p": params["p"],
                  "q": params["q"],
                  "seed": params["seed"],
                  "B_1": params["B_1"],
                  "B_2": params["B_2"],
                  "kappa0": params["kappa0"],
                  "global_stable_share": global_stable,
                  "min_date_stable_share": min(date_shares) if date_shares else float("nan"),
                  "US_stable_share": local.get("US", float("nan")),
                  "EA_stable_share": local.get("EA", float("nan")),
                  "JP_stable_share": local.get("JP", float("nan")),
                  "CH_stable_share": local.get("CH", float("nan")),
                  "worst_local_country": worst.get("country", ""),
                  "worst_local_stable_share": as_float(worst.get("stable_share")),
                  "r_LjungBox_rejection_share": r_reject,
                  "median_US_r_ar_sum": us_r_ar_sum,
                  "unstable_US_share_fixed_by_US_r_row": us_r_row_fix_share,
                  "dominant_instability_source": dominant_source,
                  "dominant_instability_source_share": dominant_source_share
              })

              sel_file = res / "stability_summary_selected_dates.csv"
              if sel_file.exists():
                  for r in read_csv(sel_file):
                      selected_all.append({
                          "profile": profile,
                          "p": params["p"],
                          "q": params["q"],
                          "B_1": params["B_1"],
                          "B_2": params["B_2"],
                          "kappa0": params["kappa0"],
                          **r
                      })

          if not comparison:
              raise SystemExit("All stability-grid profiles were incomplete.")

          comparison.sort(key=lambda r: r["global_stable_share"], reverse=True)
          out = Path("stability-grid-summary")
          out.mkdir(parents=True, exist_ok=True)

          with (out / "stability_grid_comparison.csv").open("w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=list(comparison[0].keys()))
              w.writeheader()
              w.writerows(comparison)

          if selected_all:
              fieldnames = list(selected_all[0].keys())
              with (out / "stability_grid_selected_dates.csv").open("w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=fieldnames)
                  w.writeheader()
                  w.writerows(selected_all)

          with (out / "stability_grid_readme.txt").open("w", encoding="utf-8") as f:
              f.write("TVP-GVAR P1 lag-order stability grid V3\n")
              f.write("P2_strong reference from run 32064421034: global=0.30724, US=0.8142.\n")
              f.write("P2_baseline: p=1, q=1, B_1=3, B_2=0.03, kappa0=-0.005\n")
              f.write("P2_medium: p=1, q=1, B_1=5, B_2=0.015, kappa0=-0.005\n")
              f.write("P2_strong: p=1, q=1, B_1=8, B_2=0.01, kappa0=-0.005\n")
              f.write("Primary ranking metric: overall global stable share.\n")
              f.write("Secondary checks: US local stability, interest-rate residual serial correlation, and the US short-rate AR sum.\n")

          print("\nStability grid ranking:")
          for r in comparison:
              print(r["profile"], "p=", r["p"],
                    "global stable=", round(r["global_stable_share"], 4),
                    "US=", round(r["US_stable_share"], 4),
                    "EA=", round(r["EA_stable_share"], 4),
                    "JP=", round(r["JP_stable_share"], 4),
                    "CH=", round(r["CH_stable_share"], 4),
                    "r reject=", round(r["r_LjungBox_rejection_share"], 4))
          PY

      - name: Show comparison table
        run: |
          cat stability-grid-summary/stability_grid_comparison.csv
          if [ -f stability-grid-summary/stability_grid_selected_dates.csv ]; then
            echo "Selected dates:"
            cat stability-grid-summary/stability_grid_selected_dates.csv
          fi

      - name: Upload stability-grid comparison
        uses: actions/upload-artifact@v4
        with:
          name: tvp-gvar-stability-grid-comparison-v2
          path: stability-grid-summary/
          if-no-files-found: error
          retention-days: 30
