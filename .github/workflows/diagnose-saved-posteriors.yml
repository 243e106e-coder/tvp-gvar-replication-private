name: Diagnose Saved Independent Shock Posteriors
'on':
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Original successful estimation run
        required: true
        default: '37872702188'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: github.repository == '243e106e-coder/tvp-gvar-replication-private'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        risk:
        - GPR
        - VIX
        - EPU
        - OIL
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Download saved posterior and original CSVs
      uses: actions/download-artifact@v4
      with:
        name: independent-${{ matrix.risk }}-${{ inputs.source_run_id }}
        run-id: ${{ inputs.source_run_id }}
        repository: 243e106e-coder/tvp-gvar-replication-private
        github-token: ${{ github.token }}
        path: posterior-inputs
    - name: Set up base R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: 4.4.2
    - name: Diagnose existing draws only
      env:
        RISK: ${{ matrix.risk }}
      run: Rscript --vanilla 8.12/diagnose_saved_posteriors.R "$RISK" posterior-inputs
        "results/posterior_diagnostics/$RISK"
    - name: Upload diagnostics even on reconciliation failure
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: posterior-diagnostics-${{ matrix.risk }}-${{ github.run_id }}
        path: results/posterior_diagnostics/${{ matrix.risk }}/
        if-no-files-found: warn
        retention-days: 30
