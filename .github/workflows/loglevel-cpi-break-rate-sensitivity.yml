name: Log-Level CPI Break and Interest Rate Sensitivity
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::urca
      - name: Rebuild isolated level dataset
        run: Rscript --vanilla 8.12/build_five_loglevels_input.R
      - name: Prespecified break and rate integration screening
        run: Rscript --vanilla 8.12/diagnose_cpi_break_integration_sensitivity.R
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpi-break-rate-sensitivity-${{ github.run_id }}
          path: results/break_aware_integration/
          if-no-files-found: warn
          retention-days: 30
