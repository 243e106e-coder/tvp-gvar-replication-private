name: Five Log-Levels Robust ADF KPSS Johansen
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  robust_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::urca
      - name: Build isolated log-level input
        run: Rscript --vanilla 8.12/build_five_loglevels_input.R
      - name: Run corrected rank labels, ADF sensitivity, KPSS and KR/TR CPI diagnostics
        run: Rscript --vanilla 8.12/validate_five_loglevels_robust.R
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loglevels-robust-tests-${{ github.run_id }}
          path: |
            results/loglevels_robust_preflight/
            data/loglevels/MAPPING.txt
          if-no-files-found: warn
          retention-days: 30
